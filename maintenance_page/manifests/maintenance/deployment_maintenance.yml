apiVersion: apps/v1
kind: Deployment
metadata:
  name: teaching-school-hub-finder-maintenance
  labels:
    app: teaching-school-hub-finder-maintenance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: teaching-school-hub-finder-maintenance
  template:
    metadata:
      labels:
        app: teaching-school-hub-finder-maintenance
    spec:
      nodeSelector:
        teacherservices.cloud/node_pool: applications
        kubernetes.io/os: linux
      containers:
        - name: teaching-school-hub-finder-maintenance
          image: ghcr.io/dfe-digital/teaching-school-hub-finder-maintenance:dummy-tag
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 64M
              cpu: 0.1
            limits:
              memory: 64M
              cpu: 1
